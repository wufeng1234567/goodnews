[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goodnews-backend"
version = "0.1.0"
description = "goodnews MVP - news search, exploration and fact-checking with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "openai>=1.61.0,<3.0.0",
  "langgraph>=0.2.70,<2.0.0",
  "neo4j>=5.27.0,<7.0.0",
  "scrapy>=2.12.0,<3.0.0",
  "scrapy-playwright>=0.0.43,<1.0.0",
  "playwright>=1.50.0,<2.0.0",
  "trafilatura>=2.0.0,<3.0.0",
  "googlenewsdecoder>=0.2.2,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "redis>=5.2.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.25.0,<1.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
