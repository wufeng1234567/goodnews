# goodnews infra supplement.
# PostgreSQL and Redis are already provided by the host Docker environment and
# are intentionally NOT recreated here. This file only adds the Neo4j service
# required by the knowledge-graph verification node.
name: goodnews

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: goodnews-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Neo4j strict config validation rejects any extra NEO4J_* variable, so
      # the password is supplied only through the official NEO4J_AUTH value.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-goodnews_neo4j_dev}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - goodnews_neo4j_data:/data
      - goodnews_neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  goodnews_neo4j_data:
  goodnews_neo4j_logs:
